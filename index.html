<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ARQUEMIST.</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="alternate" hreflang="es" href="es/" />
    <link rel="alternate" hreflang="en" href="en/" />
    <script>
      // Elige el idioma según el navegador: inglés si lo prefiere, español por defecto.
      (function () {
        var langs = navigator.languages || [navigator.language || ""];
        var en =
          String(langs[0] || "")
            .toLowerCase()
            .indexOf("en") === 0;
        location.replace(en ? "en/" : "es/");
      })();
    </script>
  </head>
  <body>
    <p>
      ARQUEMIST. —
      <a href="es/" hreflang="es" lang="es">Español</a> /
      <a href="en/" hreflang="en" lang="en">English</a>
    </p>
  </body>
</html>
